<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css"/>
    <title>Trabalho de Programação - Luana Machado</title>
</head>
<body>
  <header class="cabecalho">
    <h1>Confere aí</h1>
    <nav>
      <a href="#">Bem-vindo ao meu trabalho de programação</a>
    </nav>
  </header>
  <main>
    <h2>Descubra detalhes do projeto passando o mouse</h2>
    <article class="cartao">
      <div class="cartao-interno">

        <!-- FRENTE DO CARTÃO (Exibindo a imagem/foto do trabalho) -->
        <div class="cartao-frente">
          <!-- O link do Drive foi convertido para carregar a Imagem diretamente -->
          <img src="https://lh3.googleusercontent.com/d/1syHKzq0uMMxhqhS8EfegOEpYXE514Q82" alt="Foto do meu trabalho de programação" class="cartao-imagem">
          <p>Meu Projeto de Programação</p>
        </div>

        <!-- VERSO DO CARTÃO (Exibindo o vídeo ou explicação do trabalho) -->
        <div class="cartao-verso">
          <!-- Se o seu link do Drive for um VÍDEO, o iframe abaixo vai reproduzi-lo: -->
          <iframe src="https://drive.google.com/file/d/1syHKzq0uMMxhqhS8EfegOEpYXE514Q82/preview" width="100%" height="100%" allow="autoplay" style="border:none;" class="cartao-imagem"></iframe>
          
          <p>Projeto desenvolvido em código. Passe o mouse para ver o resultado!</p>
        </div>

      </div>
    </article>
  </main>
  <footer>
    <p>Projeto feito por Luana Machado</p>
  </footer>
</body>
</html>
