<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css"/>
    <title>Projeto LED - Fade In e Fade Out | Luana Machado</title>
</head>
<body>
  <header class="cabecalho">
    <h1>Confere aí</h1>
    <nav>
      <a href="#">Bem-vindo ao meu projeto com LED</a>
    </nav>
  </header>
  <main>
    <h2>Passe o mouse para ver o LED em ação</h2>
    <article class="cartao">
      <div class="cartao-interno">

        <!-- FRENTE DO CARTÃO (Foto) -->
        <div class="cartao-frente">
          <img src="foto-led.jpg" alt="Circuito LED Fade In e Fade Out" class="cartao-imagem">
          <p>Efeito LED: Fade In e Fade Out</p>
        </div>

        <!-- VERSO DO CARTÃO (Vídeo) -->
        <div class="cartao-verso">
          <video src="video-led.mp4" autoplay loop muted class="cartao-imagem"></video>
          <p>O programa faz o LED acender (Fade In) e apagar (Fade Out) suavemente.</p>
        </div>

      </div>
    </article>
  </main>
  <footer>
    <p>Projeto feito por Luana Machado</p>
  </footer>
</body>
</html>
