<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css"/>
    <title>Projeto LED - Fade In e Fade Out | Luana Machado</title>
</head>
<body>
  <header class="cabecalho">
    <h1>Confere aí</h1>
    <nav>
      <a href="#">Bem-vindo ao meu projeto com LED</a>
    </nav>
  </header>
  <main>
    <h2>Passe o mouse para ver o LED em ação</h2>
    <article class="cartao">
      <div class="cartao-interno">

        <!-- FRENTE DO CARTÃO -->
        <div class="cartao-frente">
          <!-- Imagem da foto do seu circuito/LED do Google Drive -->
          <img src="https://lh3.googleusercontent.com/d/1syHKzq0uMMxhqhS8EfegOEpYXE514Q82" alt="Circuito LED Fade In e Fade Out" class="cartao-imagem">
          <p>Efeito LED: Fade In e Fade Out</p>
        </div>

        <!-- VERSO DO CARTÃO -->
        <div class="cartao-verso">
          <!-- Se o link do Drive for um VÍDEO do LED piscando/suavizando, ele será exibido aqui: -->
          <iframe src="https://drive.google.com/file/d/1syHKzq0uMMxhqhS8EfegOEpYXE514Q82/preview" width="100%" height="100%" allow="autoplay" style="border:none;" class="cartao-imagem"></iframe>
          
          <p>O programa faz o LED acender gradualmente (Fade In) e apagar gradualmente (Fade Out).</p>
        </div>

      </div>
    </article>
  </main>
  <footer>
    <p>Projeto feito por Luana Machado</p>
  </footer>

</html>
